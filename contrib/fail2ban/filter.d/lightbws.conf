# fail2ban filter for LightBWS failed logins.
#
# Matches lines such as:
#   2026-10-25T11:30:00.123456Z  WARN lightbws::auth: web login failed ip=203.0.113.7 reason=invalid_credentials username="admin"
#   2026-10-25T11:30:00.123456Z  WARN lightbws::auth: machine login failed ip=203.0.113.7 reason=invalid_credentials client_id="..."
#
# The address is always the first field, before any client-supplied value, and client-supplied
# values are quoted and escaped, so a crafted username cannot inject a second address.
# Behind a reverse proxy, set LIGHTBWS_IP_HEADER so that ip= is the client and not the proxy.

[INCLUDES]
before = common.conf

[Definition]
failregex = ^%(__prefix_line)s\s*WARN lightbws::auth: (?:web|machine) login failed ip=<ADDR> reason=\S+ (?:username|client_id)="
ignoreregex =

# LightBWS writes RFC 3339 timestamps in UTC, for example 2026-10-25T11:30:00.123456Z. The
# pattern is not anchored, so the same filter reads LightBWS's own log file and syslog or
# journald lines that put a host and process prefix before the LightBWS timestamp.
datepattern = %%Y-%%m-%%dT%%H:%%M:%%S(?:\.%%f)?Z
